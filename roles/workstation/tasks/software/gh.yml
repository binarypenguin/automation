---
- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Install GitHub CLI APT prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Download GitHub CLI GPG key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Normalize architecture name for APT
  ansible.builtin.set_fact:
    workstation_deb_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}"
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Add GitHub CLI APT repository
  ansible.builtin.deb822_repository:
    name: github-cli
    types: [deb]
    uris: [https://cli.github.com/packages]
    suites: [stable]
    components: [main]
    architectures: ["{{ workstation_deb_arch }}"]
    signed_by: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    state: present
  register: workstation_gh_repo
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Remove legacy GitHub CLI APT source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/github-cli.list
    state: absent
  register: workstation_gh_legacy_repo
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Refresh APT cache after GitHub CLI repository changes
  ansible.builtin.apt:
    update_cache: true
  changed_when: false
  when:
    - ansible_facts['distribution'] in ['Debian', 'Ubuntu']
    - (workstation_gh_repo is defined and workstation_gh_repo.changed) or (workstation_gh_legacy_repo is defined and workstation_gh_legacy_repo.changed)

- name: Add GitHub CLI RPM repository
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/rpm/gh-cli.repo
    dest: /etc/yum.repos.d/gh-cli.repo
    mode: "0644"
  when: ansible_facts['distribution'] == 'Fedora'

- name: Ensure GitHub CLI is installed
  ansible.builtin.package:
    name: gh
    state: present
