---
- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Download GitHub CLI GPG key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Normalize architecture name for APT
  ansible.builtin.set_fact:
    workstation_deb_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}"
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Add GitHub CLI APT repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ workstation_deb_arch }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli
    state: present
    update_cache: true
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Add GitHub CLI RPM repository
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/rpm/gh-cli.repo
    dest: /etc/yum.repos.d/gh-cli.repo
    mode: '0644'
  when: ansible_facts['distribution'] == 'Fedora'

- name: Ensure GitHub CLI is installed
  ansible.builtin.package:
    name: gh
    state: present
