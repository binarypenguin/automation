---
# https://repo.steampowered.com/steam/
- name: Add Steam key
  ansible.builtin.apt_key:
    url: https://repo.steampowered.com/steam/archive/stable/steam.gpg
    keyring: /etc/apt/keyrings/steam.gpg
    state: present
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Add Steam repo
  ansible.builtin.apt_repository:
    repo: 'deb [arch=amd64 signed-by=/etc/apt/keyrings/steam.gpg] https://repo.steampowered.com/steam/ stable steam'
    filename: steam-stable
    state: present
    update_cache: true
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Install Fedora's curated third-party repository definitions
  ansible.builtin.package:
    name: fedora-workstation-repositories
    state: present
  when: ansible_facts['distribution'] == 'Fedora'

- name: Enable the RPM Fusion Steam repository
  community.general.ini_file:
    path: /etc/yum.repos.d/rpmfusion-nonfree-steam.repo
    section: rpmfusion-nonfree-steam
    option: enabled
    value: '1'
    no_extra_spaces: true
    create: false
    mode: '0644'
  when: ansible_facts['distribution'] == 'Fedora'

- name: Install Steam
  ansible.builtin.package:
    name: "{{ 'steam' if ansible_facts['distribution'] == 'Fedora' else 'steam-launcher' }}"
    state: present
