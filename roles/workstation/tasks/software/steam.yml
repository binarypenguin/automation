---
# https://repo.steampowered.com/steam/
- name: Add Steam key
  ansible.builtin.get_url:
    url: https://repo.steampowered.com/steam/archive/stable/steam.gpg
    dest: /etc/apt/keyrings/steam.gpg
    mode: '0644'
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Add Steam repo
  ansible.builtin.deb822_repository:
    name: steam-stable
    types: [deb]
    uris: [https://repo.steampowered.com/steam/]
    suites: [stable]
    components: [steam]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/steam.gpg
    state: present
  register: workstation_steam_repo
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Remove legacy Steam APT source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/steam-stable.list
    state: absent
  register: workstation_steam_legacy_repo
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Refresh APT cache after Steam repository changes
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts['distribution'] in ['Debian', 'Ubuntu']
    - workstation_steam_repo.changed or workstation_steam_legacy_repo.changed

- name: Install Fedora's curated third-party repository definitions
  ansible.builtin.package:
    name: fedora-workstation-repositories
    state: present
  when: ansible_facts['distribution'] == 'Fedora'

- name: Enable the RPM Fusion Steam repository
  community.general.ini_file:
    path: /etc/yum.repos.d/rpmfusion-nonfree-steam.repo
    section: rpmfusion-nonfree-steam
    option: enabled
    value: '1'
    no_extra_spaces: true
    create: false
    mode: '0644'
  when: ansible_facts['distribution'] == 'Fedora'

- name: Install Steam
  ansible.builtin.package:
    name: "{{ 'steam' if ansible_facts['distribution'] == 'Fedora' else 'steam-launcher' }}"
    state: present
