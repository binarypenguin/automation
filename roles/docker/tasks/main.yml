---
- name: Check supported Docker distributions
  ansible.builtin.assert:
    that: ansible_facts['distribution'] in ['Debian', 'Ubuntu', 'Fedora']
    fail_msg: "No Docker install path is defined for {{ ansible_facts['distribution'] }}."
  tags: always

- name: Load Docker package names for the host OS
  ansible.builtin.include_vars:
    file: "{{ 'Debian' if ansible_facts['os_family'] == 'Debian' else ansible_facts['distribution'] }}.yml"
  tags: always

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']
  tags:
    - docker
    - package

- name: Remove conflicting Docker packages
  ansible.builtin.package:
    name: "{{ docker_conflicting_packages }}"
    state: absent
  tags:
    - docker
    - package

- name: Install Docker prerequisites
  ansible.builtin.package:
    name: "{{ docker_prerequisite_packages }}"
    state: present
  tags:
    - docker
    - package

- name: Configure Docker APT repository
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']
  block:
    - name: Create APT keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Add Docker APT signing key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
        dest: "{{ docker_apt_keyring }}"
        owner: root
        group: root
        mode: "0644"

    - name: Add Docker APT repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: "{{ docker_apt_architecture }}"
        signed_by: "{{ docker_apt_keyring }}"
      register: docker_apt_repository
      notify: Update Docker APT cache

- name: Add Docker DNF repository
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/fedora/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts['distribution'] == 'Fedora'

- name: Apply Docker repository changes
  ansible.builtin.meta: flush_handlers

- name: Install Docker packages
  ansible.builtin.package:
    name: "{{ docker_packages }}"
    state: present
  tags:
    - docker
    - package

- name: Enable Docker service
  ansible.builtin.service:
    name: "{{ docker_service }}"
    state: started
    enabled: true
  when: not docker_rootless | bool

- name: Gather service facts
  ansible.builtin.service_facts:
  when: not docker_rootless | bool

- name: Ensure Docker service is running and enabled
  ansible.builtin.assert:
    that:
      - "'docker.service' in ansible_facts['services']"
      - ansible_facts['services']['docker.service']['state'] == 'running'
      - ansible_facts['services']['docker.service']['status'] == 'enabled'
    fail_msg: "Docker service is not installed, running, and enabled."
  when: not docker_rootless | bool

- name: Check Docker CLI can reach the daemon
  ansible.builtin.command: docker version
  changed_when: false
  when: not docker_rootless | bool
