---
- name: Check supported Docker distributions
  ansible.builtin.assert:
    that: ansible_facts['distribution'] in ['Debian', 'Ubuntu', 'Fedora']
    fail_msg: "No Docker install path is defined for {{ ansible_facts['distribution'] }}."
  tags: always

- name: Load Docker package names for the host OS
  ansible.builtin.include_vars:
    file: "{{ 'Debian' if ansible_facts['os_family'] == 'Debian' else ansible_facts['distribution'] }}.yml"
  tags: always

- name: Require rootless Docker users in host vars
  ansible.builtin.assert:
    that:
      - docker_rootless_users is defined
      - docker_rootless_users | default([]) | length > 0
    fail_msg: "Set docker_rootless_users with name and uid in this host's host_vars file."
  when: docker_rootless | bool

- name: Validate rootless Docker users
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.name | default('') is match('^[a-z_][a-z0-9_-]*$')
      - item.name | default('') not in ['root', 'docker']
      - item.uid is integer
      - item.uid | default(-1) | int >= 1500
      - item.uid | default(-1) | int <= 1599
    fail_msg: "Each rootless Docker user needs a valid name other than root or docker and an integer UID from 1500 to 1599."
  loop: "{{ docker_rootless_users | default([]) }}"
  when: docker_rootless | bool

- name: Require unique rootless Docker names and UIDs
  ansible.builtin.assert:
    that:
      - docker_rootless_users | map(attribute='name') | unique | list | length == docker_rootless_users | length
      - docker_rootless_users | map(attribute='uid') | unique | list | length == docker_rootless_users | length
    fail_msg: "Rootless Docker user names and UIDs must be unique on each host."
  when: docker_rootless | bool

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']
  tags:
    - docker
    - package

- name: Remove conflicting Docker packages
  ansible.builtin.package:
    name: "{{ docker_conflicting_packages }}"
    state: absent
  tags:
    - docker
    - package

- name: Install Docker prerequisites
  ansible.builtin.package:
    name: "{{ docker_prerequisite_packages }}"
    state: present
  tags:
    - docker
    - package

- name: Configure Docker APT repository
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']
  block:
    - name: Create APT keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Add Docker APT signing key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
        dest: "{{ docker_apt_keyring }}"
        owner: root
        group: root
        mode: "0644"

    - name: Add Docker APT repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: "{{ docker_apt_architecture }}"
        signed_by: "{{ docker_apt_keyring }}"
      register: docker_apt_repository
      notify: Update Docker APT cache

- name: Add Docker DNF repository
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/fedora/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts['distribution'] == 'Fedora'

- name: Apply Docker repository changes
  ansible.builtin.meta: flush_handlers

- name: Install Docker packages
  ansible.builtin.package:
    name: "{{ docker_packages }}"
    state: present
  tags:
    - docker
    - package

- name: Configure rootful Docker
  ansible.builtin.import_tasks: rootful_docker.yml
  when: not docker_rootless | bool

- name: Configure rootless Docker
  ansible.builtin.import_tasks: rootless_docker.yml
  when: docker_rootless | bool
