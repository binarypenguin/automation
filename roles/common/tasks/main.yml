---
- name: Check supported package distributions
  ansible.builtin.assert:
    that: ansible_facts['distribution'] in ['Debian', 'Ubuntu', 'Fedora']
    fail_msg: "No common package list is defined for {{ ansible_facts['distribution'] }}."
  tags: always

- name: Load package names for the host OS
  ansible.builtin.include_vars:
    file: "{{ 'Debian' if ansible_facts['os_family'] == 'Debian' else ansible_facts['distribution'] }}.yml"
  tags: always

- name: Update APT cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']
  tags: package

- name: Ensure minimal packages are installed
  ansible.builtin.package:
    name: "{{ common_minimal_packages }}"
    state: present
  tags: package

- name: Ensure additional packages are installed on standard hosts
  ansible.builtin.package:
    name: "{{ common_standard_packages }}"
    state: present
  when:
    - security_profile | default('standard') != 'minimal'
  tags: package

- name: Ensure packages are installed (On physical machines only)
  ansible.builtin.package:
    name:
      - memtester
      - smartmontools
    state: present
  when:
    - ansible_facts['virtualization_role'] == "host"
  tags: package

- name: Enable SSH
  ansible.builtin.include_tasks: ssh.yml
  tags: ssh

- name: Include MOTD Task
  ansible.builtin.include_tasks: motd.yml
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Include molly-guard task
  ansible.builtin.include_tasks: molly-guard.yml
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Create /etc/apt/keyrings folder
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']

- name: Enable Colored Prompts
  ansible.builtin.lineinfile:
    dest: /etc/profile.d/binarypenguin.sh
    line: "export force_color_prompt=yes"
    mode: "0755"
    create: true
  tags: binary-penguin-preferences

- name: Clone Binary Penguin Scripts
  ansible.builtin.git:
    repo: 'https://github.com/binarypenguin/scripts.git'
    dest: /opt/binarypenguin
    update: true
    accept_hostkey: true
    version: "{{ binarypenguin_scripts.version | default('HEAD') }}"
  tags: binary-penguin-scripts

- name: Add Binary Penguin Scripts to $PATH
  ansible.builtin.lineinfile:
    dest: /etc/profile.d/binarypenguin.sh
    line: "export PATH=$PATH:/opt/binarypenguin/bin"
    mode: "0755"
    create: true
  tags: binary-penguin-scripts
