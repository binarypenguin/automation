---
- name: Ensure minimal packages are installed
  ansible.builtin.apt:
    package: "{{ minimal_packages }}"
    state: present
  vars:
    minimal_packages:
      - figlet
      - git
      - htop
      - iftop
      - iotop
      - ncdu
      - ssh
      - uptimed
  tags: package

- name: Ensure additional packages are installed on standard hosts
  ansible.builtin.apt:
    package: "{{ standard_packages }}"
    state: present
  when: security_profile | default('standard') != 'minimal'
  vars:
    standard_packages:
      - iperf
      - mtr
      - python3-dev
      - python3-pip
      - python3-venv
      - screen
      - sshfs
  tags: package

- name: Ensure packages are installed (On physical machines only)
  ansible.builtin.apt:
    package: "{{ packages }}"
    state: present
  vars:
    packages:
      - smartmontools
      - memtester
  when: ansible_virtualization_role == "host"
  tags: package

- name: Enable SSH
  ansible.builtin.include_tasks: ssh.yml

- name: Include MOTD Task
  ansible.builtin.include_tasks: motd.yml

- name: Include molly-guard task
  ansible.builtin.include_tasks: molly-guard.yml

- name: Create /etc/apt/keyrings folder
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Enable Colored Prompts
  ansible.builtin.lineinfile:
    dest: /etc/profile.d/binarypenguin.sh
    line: "export force_color_prompt=yes"
    mode: "0755"
    create: true
  tags: binary-penguin-preferences

##
# NFS Share
##
# TODO: We aren't currently using NFS Shares
# - include_tasks: nfs.yml
