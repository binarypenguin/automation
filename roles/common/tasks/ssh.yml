---
- name: Ensure SSH service is enabled and running
  ansible.builtin.service:
    name: "{{ common_ssh_service }}"
    state: started
    enabled: true
  tags: ssh

- name: Check authorized_keys for critical users
  ansible.builtin.stat:
    path: "/home/{{ item }}/.ssh/authorized_keys"
  register: common_user_keys_results
  loop:
    - travis
    - "{{ ansible_facts['env']['USER'] }}"
  when: item != 'root'
  failed_when: false

- name: Read existing authorized_keys files
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop: >-
    {{ common_user_keys_results.results
       | selectattr('stat', 'defined')
       | selectattr('stat.exists')
       | map(attribute='stat.path')
       | unique | list }}
  register: common_authorized_keys_files
  no_log: true

- name: Initialize authorized key count
  ansible.builtin.set_fact:
    common_authorized_key_count: 0

- name: Count authorized keys for critical users
  ansible.builtin.set_fact:
    common_authorized_key_count: >-
      {{ (common_authorized_key_count | int)
         + ((item.content | b64decode).splitlines() | map('trim')
            | reject('equalto', '') | reject('match', '^#') | list | length) }}
  loop: "{{ common_authorized_keys_files.results }}"
  no_log: true

- name: Ensure at least one authorized key exists for a critical user
  ansible.builtin.assert:
    that: (common_authorized_key_count | int) > 0
    fail_msg: "No authorized keys found for the checked users."
    success_msg: "Found {{ common_authorized_key_count }} authorized key entries for the checked users."

- name: SSHD - Disable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication '
    line: 'PasswordAuthentication no'
    validate: "{{ common_sshd_binary }} -t -f %s"
    state: present
    backup: true
  notify:
    - Restart sshd
  tags: ssh

- name: SSHD - Disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin '
    line: 'PermitRootLogin no'
    validate: "{{ common_sshd_binary }} -t -f %s"
    state: present
    backup: true
  notify:
    - Restart sshd
  tags: ssh

- name: SSHD - Disable empty passwords
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitEmptyPasswords '
    line: 'PermitEmptyPasswords no'
    validate: "{{ common_sshd_binary }} -t -f %s"
    state: present
    backup: true
  notify:
    - Restart sshd
  tags: ssh

- name: Limit SSH Access via UFW
  community.general.ufw:
    rule: limit
    port: ssh
    proto: tcp
    comment: 'SSH rate limiting'
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']
  tags:
    - ssh
    - ufw
