---
- name: Ensure SSH service is enabled and running
  ansible.builtin.service:
    name: "{{ common_ssh_service }}"
    state: started
    enabled: true
  tags: ssh

- name: Determine the SSH login account
  ansible.builtin.command: id -un
  become: false
  register: common_ssh_login_account
  changed_when: false
  tags: always

- name: Require a non-root SSH login account
  ansible.builtin.assert:
    that: common_ssh_login_account.stdout != 'root'
    fail_msg: "The SSH login account is root, but this role disables root SSH login."
  tags: always

- name: Look up the SSH login account's home directory
  ansible.builtin.getent:
    database: passwd
    key: "{{ common_ssh_login_account.stdout }}"
  tags: always

- name: Check the SSH login account's authorized_keys
  ansible.builtin.stat:
    path: "{{ ansible_facts.getent_passwd[common_ssh_login_account.stdout][4] }}/.ssh/authorized_keys"
  register: common_ssh_authorized_keys_stat
  tags: always

- name: Require an authorized_keys file for the SSH login account
  ansible.builtin.assert:
    that:
      - common_ssh_authorized_keys_stat.stat.exists
      - common_ssh_authorized_keys_stat.stat.isreg
    fail_msg: "No authorized_keys file exists for SSH login account {{ common_ssh_login_account.stdout }}."
  tags: always

- name: Read the SSH login account's authorized_keys
  ansible.builtin.slurp:
    src: "{{ common_ssh_authorized_keys_stat.stat.path }}"
  register: common_ssh_authorized_keys
  no_log: true
  tags: always

- name: Require an authorized key for the SSH login account
  ansible.builtin.assert:
    that: >-
      (common_ssh_authorized_keys.content | b64decode).splitlines()
      | map('trim') | reject('equalto', '') | reject('match', '^#')
      | list | length > 0
    fail_msg: "No active authorized key exists for SSH login account {{ common_ssh_login_account.stdout }}."
  tags: always

- name: SSHD - Disable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication '
    line: 'PasswordAuthentication no'
    validate: "{{ common_sshd_binary }} -t -f %s"
    state: present
    backup: true
  notify:
    - Restart sshd
  tags: ssh

- name: SSHD - Disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin '
    line: 'PermitRootLogin no'
    validate: "{{ common_sshd_binary }} -t -f %s"
    state: present
    backup: true
  notify:
    - Restart sshd
  tags: ssh

- name: SSHD - Disable empty passwords
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitEmptyPasswords '
    line: 'PermitEmptyPasswords no'
    validate: "{{ common_sshd_binary }} -t -f %s"
    state: present
    backup: true
  notify:
    - Restart sshd
  tags: ssh

- name: Limit SSH Access via UFW
  community.general.ufw:
    rule: limit
    port: ssh
    proto: tcp
    comment: 'SSH rate limiting'
  when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']
  tags:
    - ssh
    - ufw
