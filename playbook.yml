---
- name: Check Ansible Environment
  hosts: localhost
  tasks:
    - name: Checking Ansible Version
      ansible.builtin.assert:
        that:
          - ansible_version.full is defined
          - ansible_version.full is version('2.9', 'gt')

# Common Configuration

- name: Apply common configuration to all nodes
  hosts: all
  become: true
  roles:
    - role: common
    # TODO: These is specific to Gnome.
    # - role: user_customizations
    #   tags:
    #     - user_customizations

# Monitoring Configuration
- name: Apply monitoring configuration to all nodes
  hosts: all
  become: true
  roles:
    - role: monitoring
      tags:
        - monitoring

# Docker Configuration
- name: Docker configuration
  hosts: docker_hosts
  become: true
  roles:
    - role: docker
      tags:
        - docker


# Headscale Configuration
- name: Headscale configuration
  hosts: headscale
  become: true
  roles:
    - role: headscale
      tags:
        - headscale

# Workstation Configuration
- name: Workstation configuration
  hosts: workstations
  become: true
  roles:
    - role: workstation
      tags:
        - workstation

# Enable Firewall
- name: Enable firewall
  hosts: all
  become: true
  tasks:
    - name: Enable UFW with default deny policy
      community.general.ufw:
        state: enabled
        policy: deny
        logging: true
      when: ansible_facts['distribution'] in ['Debian', 'Ubuntu']
      tags:
        - firewall
        - security
        - ufw
